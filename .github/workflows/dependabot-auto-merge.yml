name: Dependabot auto-merge

# Turns on GitHub's native auto-merge for Dependabot PRs that only bump
# minor/patch versions. It does not merge anything by itself: GitHub merges
# the PR only once every required check (lint/typecheck/unit, E2E,
# production smoke, Lighthouse) is green. A red check leaves the PR open for
# a human — typically the Playwright Docker tag in ci.yml lagging behind a
# @playwright/test bump. Major updates are left for manual review: for
# those, an issue assigned to the repo owner is opened instead, so the
# notification email stands out ("❗" in the subject) from routine
# Dependabot traffic.
on: pull_request

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3

      - name: Enable auto-merge for minor/patch updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open an issue for a major update
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-major' &&
          github.event.action == 'opened'
        run: |
          body="@$OWNER Dependabot opened $PR_URL with a **major** version bump of \`$DEPS\` ($PREV → $NEW). It is not auto-merged: check the changelog for breaking changes and the CI result, then merge or close the PR by hand. Close this issue once done."
          gh issue create --repo "$REPO" --assignee "$OWNER" \
            --title "❗ Major update needs review: $DEPS $PREV → $NEW" \
            --body "$body"
        env:
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          DEPS: ${{ steps.metadata.outputs.dependency-names }}
          PREV: ${{ steps.metadata.outputs.previous-version }}
          NEW: ${{ steps.metadata.outputs.new-version }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
